<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide Block Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="mode-techyblocks">
    <!-- ── Header (populated by ModeSwitcher.js) ───── -->
    <header id="appHeader">
    </header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">
      <!-- Blockly workspace (always visible) -->
      <!-- ── Blocks Zone Panel ── -->
      <div id="blocksZone">
        <div class="zone-bar zone-bar--blocks">
          <div class="zone-bar-left">
            <svg class="zone-bar-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="8" height="8" rx="1.5"/><rect x="14" y="2" width="8" height="8" rx="1.5"/><rect x="2" y="2" width="8" height="8" rx="1.5"/><path d="M14 14h1.5a2.5 2.5 0 0 1 0 5H14"/><path d="M10 18.5V20a2 2 0 0 0 4 0v-1.5"/></svg>
            <span class="zone-bar-title">Blocks Workspace</span>
            
            <button id="headerExtensionBtn" class="zone-header-ext-btn" title="Add Extension">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
              <span>Extensions</span>
            </button>

            <!-- Tools toolbar right after Extensions -->
            <div class="zone-toolbar">
              <button class="zone-tool-btn zone-examples-btn" id="headerExamplesBtn" title="Examples Library (Grade 3-12)">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
                <span>Examples</span>
              </button>
              <button class="zone-tool-btn" id="headerSaveBtn" title="Save Project">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                <span>Save</span>
              </button>
              <button class="zone-tool-btn" id="headerImportBtn" title="Open Blocks Project">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 11 15 14"/></svg>
                <span>Open</span>
              </button>
              <span class="zone-tool-sep"></span>
              <button class="zone-tool-btn zone-tool-btn--icon" id="headerUndoBtn" title="Undo (Ctrl+Z)">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
              </button>
              <button class="zone-tool-btn zone-tool-btn--icon" id="headerRedoBtn" title="Redo (Ctrl+Y)">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
              </button>
            </div>
          </div>
          <span class="zone-bar-badge" id="blocksZoneBadge">TechyBlocks</span>
        </div>
        <div id="blocklyDiv"></div>

        <!-- Sticky Scratch Extension Button at bottom-left corner of category palette -->
        <button id="scratchStickyExtBtn" class="scratch-sticky-ext-btn" title="Add Extension">
          <div class="scratch-sticky-ext-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <span class="scratch-sticky-ext-label">Extensions</span>
        </button>
      </div>
      
      <!-- Pane Toggle Button -->
      <button id="togglePaneBtn" class="pane-toggle-btn" title="Toggle Sidebar">
        <i data-lucide="chevron-right" style="width:20px;height:20px;"></i>
      </button>

      <!-- RIGHT PANE: TechyBlocks mode (default) -->
      <div id="animationPane" class="right-pane">
        <div id="stageContainer">
          <div id="stageControls" class="stage-controls">
            <button id="greenFlagBtn" class="control-btn flag-btn start-circle-btn" title="Start" onclick="window.__greenFlag()">
              <span class="start-circle"></span>
            </button>
            <button id="stopBtn" class="control-btn stop-btn" title="Stop" onclick="window.__stopAll()">
              <i data-lucide="square" color="#d35400" stroke-width="2.5" fill="#d35400" style="width: 18px; height: 18px; pointer-events: none;"></i>
            </button>
            <button id="maximizeStageBtn" class="control-btn maximize-stage-btn" title="Maximize Stage" onclick="window.__toggleStageMaximize()">
              <i data-lucide="maximize-2" stroke-width="2" style="width: 15px; height: 15px; pointer-events: none;"></i>
            </button>
          </div>
          <div id="stageCanvas"></div>
        </div>
        <div id="spritePanelContainer"></div>
      </div>

      <!-- RIGHT PANE: Board mode (hidden by default) -->
      <div id="boardPane" class="right-pane" style="display: none;">
        <!-- Code Zone Header -->
        <div class="zone-bar zone-bar--code">
          <div class="zone-bar-left">
            <svg class="zone-bar-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span class="zone-bar-title">Code Generator</span>
          </div>
          <span class="zone-bar-badge" id="codeZoneBadge">C++ / MICROPYTHON</span>
        </div>

        <!-- ── Board Stage Sub-view (toggled from header pills) ── -->
        <div id="boardStageView" class="board-subview" style="display:none;">
          <div id="boardStageSlot"></div>
        </div>

        <!-- ── Board Code Sub-view ── -->
        <div id="boardCodeView" class="board-subview">

          <div class="editor-header">
            <div class="file-tab" id="codeFileTab">
              <i data-lucide="file-code-2" style="width: 16px; height: 16px;"></i>
              <span id="codeFileName">sketch.ino</span>
            </div>
            <select class="env-dropdown" id="envDropdown">
              <option value="arduino">C++ (Arduino)</option>
              <option value="micropython">MicroPython</option>
            </select>
            <select class="env-dropdown" id="boardDropdown" title="Target Board" style="margin-left:6px;">
              <option value="esp32">🤖 I-Bot (ESP32)</option>
              <option value="pico">🏎️ Te-Bot (Pico)</option>
            </select>
          </div>



          <!-- Code Editor Body: gutter + editable textarea -->
          <div class="code-editor-body" id="codeEditorBody">
            <div class="code-gutter" id="codeGutter"></div>
            <textarea
              class="code-content code-textarea"
              id="codeContent"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              data-gramm="false"
            ></textarea>
          </div>

          <!-- Progress Bar -->
          <div id="uploadProgressWrapper" style="display: none; border-top: 1px solid var(--border); background-color: var(--code-bg); padding: 8px 12px; flex-shrink: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px;">
              <span id="uploadProgressLabel" style="color: var(--text-secondary); font-weight: 500;">Compiling...</span>
              <span id="uploadProgressPercent" style="color: var(--text-secondary); font-weight: 600;">0%</span>
            </div>
            <div style="width: 100%; height: 6px; background-color: var(--border); border-radius: 3px; overflow: hidden; position: relative;">
              <div id="uploadProgressBar" class="progress-bar-animated" style="width: 0%; height: 100%; border-radius: 3px; transition: width 0.2s ease;"></div>
            </div>
          </div>

          <div class="editor-footer">
            <button class="toolbar-btn" id="downloadCodeBtn">
              <i data-lucide="download" style="width: 16px; height: 16px;"></i>
              <span id="downloadBtnLabel">Download .ino</span>
            </button>
            <button class="toolbar-btn nav-btn--connect" id="footerConnectBtn" title="Connect Board / Serial">
              <i data-lucide="cpu" style="width: 16px; height: 16px;"></i>
              <span id="footerConnectBtnLabel">Connect</span>
            </button>
            <button class="toolbar-btn" id="uploadBtn">
              <i data-lucide="upload" style="width: 16px; height: 16px;"></i>
              <span id="uploadBtnLabel">Upload Code</span>
            </button>
            <span id="uploadStatus" style="font-size: 11px; margin-left: auto; color: var(--text-muted); display: none;"></span>
          </div>

          <!-- ── Serial Monitor ── -->
          <div id="serialMonitorContainer"></div>

        </div><!-- /boardCodeView -->
      </div><!-- /boardPane -->
    </div>

    <!-- Hidden legacy elements (kept for compatibility) -->
    <pre id="generatedCode" style="display:none;"><code></code></pre>
  </body>
</html>
