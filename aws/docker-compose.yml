version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: aws/Dockerfile.backend
    image: techyguide-backend:latest
    container_name: techyguide-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ARDUINO_DATA_DIR: /arduino-data
      ARDUINO_LIBRARIES_DIR: /arduino-libraries
      # PUBLIC HTTPS URL of this Lightsail server — REQUIRED for Cloud OTA.
      # ESP32 devices use this to construct the absolute firmware download URL.
      # Change to your actual domain before deploying.
      SERVER_BASE_URL: "https://block.techyguide.in"
      # Restrict CORS to your frontend origin:
      # CORS_ORIGIN: https://block.techyguide.in
    volumes:
      # Persist arduino-cli packages and libraries
      - arduino-data:/arduino-data
      - arduino-libraries:/arduino-libraries
      # Persist compiled firmware binaries and Cloud OTA job state across restarts
      - techyguide-state:/root/.techyguide
      # Mount code so changes sync live without full rebuilds
      - ../server:/app/server
      - ../aws:/app/aws
    restart: unless-stopped

volumes:
  arduino-data:
  arduino-libraries:
  # Persists Cloud OTA state JSON and compiled firmware binaries across container restarts
  techyguide-state:
